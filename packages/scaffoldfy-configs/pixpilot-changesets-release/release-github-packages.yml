# .github/workflows/release.yml

name: Release Package

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      # Publishing targets GitHub Packages (publishConfig.registry in each package.json),
      # which authenticates with a token rather than npm OIDC trusted publishing.
      packages: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      published-versions: ${{ steps.release.outputs.published-versions }}
      release-summary: ${{ steps.release.outputs.release-summary }}

    steps:
      - name: Generate bot app token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup project
        uses: pixpilot/github-actions/setup-pnpm-project@v1
        with:
          registry-url: 'https://npm.pkg.github.com'
          # setup-node defaults the scope to the repository owner. Left to that
          # default it would send @pixpilot-private packages to npmjs, and
          # redirect the public @pixpilot packages this repo consumes to GitHub
          # Packages — breaking both the publish and the install.
          scope: '@pixpilot-private'
          build: 'false'

      - name: Release
        id: release
        uses: pixpilot/changesets-autopilot@v1
        with:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          # GitHub Packages auth. Must be a token with write:packages on the
          # package scope; npm OIDC trusted publishing is npmjs-only.
          # https://github.com/pixpilot-private
          REGISTRY_TOKEN: ${{ secrets.PIXPILOT_PRIVATE_REGISTRY_TOKEN }}
          # npm provenance attestation is not supported by npm.pkg.github.com.
          provenance: 'false'

  notify:
    name: Notify Release Status
    needs: [ci, release]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram release-status notification
        uses: pixpilot/notify-action@v1
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          notify-on: any
          # Names the released versions; an empty title falls back to the generated one.
          title: ${{ needs.release.outputs.published == 'true' && format('Released {0} ({1})', needs.release.outputs.published-versions, github.repository) || '' }}
          # Published packages, why nothing was published, or why the release failed.
          message: ${{ needs.release.outputs.release-summary }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
